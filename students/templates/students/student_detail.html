<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Student Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">
            Student Management System
        </a>
    </div>
</nav>

<div class="container mt-5">

    <div class="card shadow mx-auto" style="max-width: 700px;">

        <div class="card-header bg-info">
            <h4 class="mb-0">Student Details</h4>
        </div>

        <div class="card-body">

            <div class="row mb-3">
                <div class="col-sm-4 fw-bold">ID</div>
                <div class="col-sm-8">{{ student.id }}</div>
            </div>

            <div class="row mb-3">
                <div class="col-sm-4 fw-bold">Name</div>
                <div class="col-sm-8">{{ student.name }}</div>
            </div>

            <div class="row mb-3">
                <div class="col-sm-4 fw-bold">Email</div>
                <div class="col-sm-8">{{ student.email }}</div>
            </div>

            <div class="row mb-3">
                <div class="col-sm-4 fw-bold">Phone</div>
                <div class="col-sm-8">{{ student.phone }}</div>
            </div>

            <div class="row mb-3">
                <div class="col-sm-4 fw-bold">Course</div>
                <div class="col-sm-8">{{ student.course }}</div>
            </div>

            <div class="row mb-3">
                <div class="col-sm-4 fw-bold">Age</div>
                <div class="col-sm-8">{{ student.age }}</div>
            </div>

            <div class="row mb-3">
                <div class="col-sm-4 fw-bold">Address</div>
                <div class="col-sm-8">{{ student.address }}</div>
            </div>

            <hr>

            <a href="{% url 'edit_student' student.id %}"
               class="btn btn-warning">
                Edit
            </a>

            <a href="{% url 'student_list' %}"
               class="btn btn-secondary">
                Back
            </a>

        </div>

    </div>

</div>

</body>
</html>
